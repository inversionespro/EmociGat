name: Compilar EmociGat Definitivo

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Organizar y compilar
      run: |
        mkdir -p app/src/main/java/com/inversionespro/emocigat
        mkdir -p app/src/main/assets
        
        find . -maxdepth 1 -name "*.java" -exec cp {} app/src/main/java/com/inversionespro/emocigat/ \;
        [ -f emociones.json ] && cp emociones.json app/src/main/assets/
        
        printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <application android:allowBackup="true" android:label="EmociGat" android:theme="@style/Theme.AppCompat">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n        <service android:name=".EmociGatAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">\n            <intent-filter>\n                <action android:name="android.accessibilityservice.AccessibilityService" />\n            </intent-filter>\n        </service>\n    </application>\n</manifest>' > app/src/main/AndroidManifest.xml
        
        echo "include ':app'" > settings.gradle
        
        echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
        
        echo "apply plugin: 'com.android.application'" > app/build.gradle
        echo "android { namespace 'com.inversionespro.emocigat'; compileSdk 34; defaultConfig { applicationId 'com.inversionespro.emocigat'; minSdk 24; targetSdk 34 } }" >> app/build.gradle
        echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" >> app/build.gradle
        
        gradle assembleDebug

    - uses: actions/upload-artifact@v4
      with:
        name: EmociGat-APK-Final
        path: app/build/outputs/apk/debug/app-debug.apk
        
