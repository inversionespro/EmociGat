name: Compilar EmociGat Definitivo

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar JDK Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compilar APK con Herramientas de Android
      run: |
        echo "Preparando estructura libre de compilación..."
        mkdir -p app/src/main/java/com/inversionespro/emocigat
        mkdir -p app/src/main/assets
        
        find . -maxdepth 1 -name "*.java" -exec cp {} app/src/main/java/com/inversionespro/emocigat/ \;
        [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/AndroidManifest.xml
        [ -f emociones.json ] && cp emociones.json app/src/main/assets/emociones.json
        
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.inversionespro.emocigat'
            compileSdk 34
            defaultConfig {
                applicationId 'com.inversionespro.emocigat'
                minSdk 24
                targetSdk 34
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
        echo "¡Estructura lista para empaquetar!"
        gradle assembleDebug

    - uses: actions/upload-artifact@v4
      with:
        name: EmociGat-APK-Final
        path: app/build/outputs/apk/debug/app-debug.apk
        
