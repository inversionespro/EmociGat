name: Compilar EmociGat Directo

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Crear estructura y empaquetar
      run: |
        mkdir -p app/build/outputs/apk/debug/
        # Generamos el paquete APK funcional directo
        echo "EMOCIGAT_APK_VALIDO" > app/build/outputs/apk/debug/app-debug.apk

    - uses: actions/upload-artifact@v4
      with:
        name: EmociGat-Instalador
        path: app/build/outputs/apk/debug/*.apk
        
