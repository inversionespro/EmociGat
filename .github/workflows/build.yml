name: Compilar EmociGat Profesional

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Preparar estructura y dependencias de Android
      run: |
        mkdir -p app/src/main/java/com/inversionespro/emocigat
        mkdir -p app/src/main/assets
        
        # Copiar todos los archivos .java de la raíz a la ruta correcta
        find . -maxdepth 1 -name "*.java" -exec cp {} app/src/main/java/com/inversionespro/emocigat/ \;
        [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/AndroidManifest.xml
        [ -f emociones.json ] && cp emociones.json app/src/main/assets/emociones.json
        
        # Configuración limpia de Gradle
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.inversionespro.emocigat'
            compileSdk 34
            defaultConfig {
                applicationId 'com.inversionespro.emocigat'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Compilar APK de depuración
      run: gradle assembleDebug

    - name: Subir artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: EmociGat-APK-Final
        path: app/build/outputs/apk/debug/app-debug.apk
        
