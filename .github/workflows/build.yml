name: Compilar EmociGat Real

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar proyecto Android
        run: |
          mkdir -p app/src/main/java/com/invertirpro/emocigat
          cp *.java app/src/main/java/com/invertirpro/emocigat/ 2>/dev/null || true
          cp AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mkdir -p app/src/main/assets
          cp emociones.json app/src/main/assets/ 2>/dev/null || true
          
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.invertirpro.emocigat'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.invertirpro.emocigat'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Construir APK instalable
        run: gradle assembleDebug

      - name: Guardar APK listo
        uses: actions/upload-artifact@v4
        with:
          name: EmociGat-Instalador
          path: app/build/outputs/apk/debug/app-debug.apk
          
