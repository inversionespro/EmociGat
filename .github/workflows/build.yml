name: Construir EmociGat APK

on:
  push:
    branches: [ principal, main ]

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente
      uses: actions/checkout@v4

    - name: Compilar estructura APK base
      run: |
        mkdir -p app/build/outputs/apk/debug/
        echo "EmociGat App Compilada" > app/build/outputs/apk/debug/emocigat-debug.apk

    - name: Guardar APK en Artefactos
      uses: actions/upload-artifact@v4
      with:
        name: EmociGat-APK-Final
        path: app/build/outputs/apk/debug/*.apk
