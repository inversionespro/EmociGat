name: Compilar EmociGat Definitivo

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Organizar y compilar
      run: |
        mkdir -p app/src/main/java/com/invertirpro/emocigat
        mkdir -p app/src/main/assets
        
        # Mover archivos si existen a su ruta correcta
        find . -maxdepth 1 -name "*.java" -exec cp {} app/src/main/java/com/invertirpro/emocigat/ \;
        [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/
        [ -f emociones.json ] && cp emociones.json app/src/main/assets/
        
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.inversionespro.emocigat'
            compileSdk 34
            defaultConfig {
                applicationId 'com.inversionespro.emocigat'
                minSdk 24
                targetSdk 34
            }
        }
        EOF
        
        gradle assembleDebug

    - uses: actions/upload-artifact@v4
      with:
        name: EmociGat-APK-Final
        path: app/build/outputs/apk/debug/app-debug.apk
        
